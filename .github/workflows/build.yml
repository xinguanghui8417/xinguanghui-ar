name: Build iOS App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen（工程生成工具）
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名，验证代码可构建）
        run: |
          xcodebuild -project XinguanghuiAR.xcodeproj \
            -scheme XinguanghuiAR \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打包 .ipa（供 AltStore 侧载）
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/XinguanghuiAR.app Payload/
          zip -qr XinguanghuiAR.ipa Payload/
          ls -lh XinguanghuiAR.ipa

      - name: 上传 .ipa 产物
        uses: actions/upload-artifact@v4
        with:
          name: XinguanghuiAR-ipa
          path: XinguanghuiAR.ipa
          if-no-files-found: error
